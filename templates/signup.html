<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CineSuggest</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <div style="font-size: 3rem; margin-bottom: 10px;">🎟️</div>
    <h2>Join CineSuggest</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: -15px; margin-bottom: 25px;">Create your account to unlock favorites & recommendations</p>
    {% if error %}
    <div class="alert">
        {{ error }}
    </div>
    {% endif %}

    <form action="/signup" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="choose a username" required autofocus>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="enter your email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" style="margin-top: 10px;">Register</button>
    </form>

    <div style="margin-top: 25px;">
        <span style="color: var(--text-muted); font-size: 0.9rem;">Already have an account?</span>
        <a href="/" style="margin-top: 0; margin-left: 5px; font-weight: 600; color: var(--primary-color);">Sign In</a>
    </div>
</div>

</body>
</html>
